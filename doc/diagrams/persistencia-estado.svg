<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="560" fill="#11161c"/>
  <text x="460" y="42" fill="#e8eef5" font-size="24" font-weight="600" text-anchor="middle">Persistencia del estado de la biblioteca</text>
  <text x="460" y="67" fill="#8ea2b5" font-size="14" text-anchor="middle">Biblioteca Interactiva 2D — Laboratorio 7</text>

  <defs>
    <marker id="az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fb3d8"/>
    </marker>
    <marker id="vd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fc78a"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8b26f"/>
    </marker>
  </defs>

  <!-- GUI -->
  <rect x="48" y="130" width="196" height="96" rx="12" fill="#1b2630" stroke="#6fb3d8" stroke-width="2.5"/>
  <text x="146" y="166" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">Pantallas</text>
  <text x="146" y="190" fill="#8ea2b5" font-size="12.5" text-anchor="middle">sala de lectura</text>
  <text x="146" y="208" fill="#8ea2b5" font-size="12.5" text-anchor="middle">préstamos activos</text>

  <!-- EventBus -->
  <rect x="330" y="130" width="196" height="96" rx="12" fill="#1b2630" stroke="#6fb3d8" stroke-width="2.5"/>
  <text x="428" y="166" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">EventBus</text>
  <text x="428" y="190" fill="#8ea2b5" font-size="12.5" text-anchor="middle">item_removed</text>
  <text x="428" y="208" fill="#8ea2b5" font-size="12.5" text-anchor="middle">pass_redeemed</text>

  <!-- GlobalManager -->
  <rect x="612" y="110" width="260" height="136" rx="12" fill="#1b2630" stroke="#d8b26f" stroke-width="2.5"/>
  <text x="742" y="142" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">GlobalManager</text>
  <text x="742" y="167" fill="#8ea2b5" font-size="12.5" text-anchor="middle">único dueño del estado</text>
  <line x1="632" y1="182" x2="852" y2="182" stroke="#3a4550" stroke-width="1.5"/>
  <text x="742" y="204" fill="#d8c49a" font-size="13" text-anchor="middle">guardar_datos()</text>
  <text x="742" y="226" fill="#d8c49a" font-size="13" text-anchor="middle">cargar_datos()</text>

  <!-- Archivo -->
  <rect x="612" y="330" width="260" height="122" rx="12" fill="#161d25" stroke="#6fc78a" stroke-width="2.5"/>
  <text x="742" y="362" fill="#e8eef5" font-size="16" font-weight="600" text-anchor="middle">user://save_data.json</text>
  <text x="742" y="386" fill="#8ea2b5" font-size="12" text-anchor="middle">version · plan_activo</text>
  <text x="742" y="404" fill="#8ea2b5" font-size="12" text-anchor="middle">prestamos · pases</text>
  <text x="742" y="422" fill="#7d8b99" font-size="11" text-anchor="middle">escritorio: carpeta de datos</text>
  <text x="742" y="437" fill="#7d8b99" font-size="11" text-anchor="middle">navegador: IndexedDB</text>

  <!-- Flechas: intención -->
  <line x1="244" y1="162" x2="323" y2="162" stroke="#6fb3d8" stroke-width="2.5" marker-end="url(#az)"/>
  <text x="283" y="151" fill="#9dc8e0" font-size="11.5" text-anchor="middle">intención</text>

  <line x1="526" y1="162" x2="605" y2="162" stroke="#6fb3d8" stroke-width="2.5" marker-end="url(#az)"/>

  <!-- Flechas: notificación de vuelta -->
  <line x1="605" y1="206" x2="526" y2="206" stroke="#6fc78a" stroke-width="2.5" marker-end="url(#vd)"/>
  <line x1="323" y1="206" x2="244" y2="206" stroke="#6fc78a" stroke-width="2.5" marker-end="url(#vd)"/>
  <text x="310" y="246" fill="#9ed8b4" font-size="11.5" text-anchor="middle">loans_updated · passes_updated</text>

  <!-- Escritura -->
  <line x1="700" y1="246" x2="700" y2="323" stroke="#d8b26f" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="688" y="290" fill="#d8c49a" font-size="12.5" text-anchor="end">escribe tras</text>
  <text x="688" y="307" fill="#d8c49a" font-size="12.5" text-anchor="end">cada cambio</text>

  <!-- Lectura -->
  <line x1="790" y1="328" x2="790" y2="253" stroke="#6fc78a" stroke-width="2.5" marker-end="url(#vd)"/>
  <text x="802" y="285" fill="#9ed8b4" font-size="12.5">lee en</text>
  <text x="802" y="302" fill="#9ed8b4" font-size="12.5">_ready()</text>

  <!-- Nota de validación -->
  <rect x="48" y="330" width="500" height="110" rx="10" fill="#161d25" stroke="#3a4550" stroke-width="1.5"/>
  <text x="70" y="358" fill="#c9d6e2" font-size="13.5" font-weight="600">Lo leído no se cree: se reconstruye</text>
  <text x="70" y="382" fill="#8ea2b5" font-size="12.5">· Versión de esquema distinta → se ignora el archivo completo.</text>
  <text x="70" y="403" fill="#8ea2b5" font-size="12.5">· Ejemplar fuera del catálogo o plazo desconocido → se descarta ese préstamo.</text>
  <text x="70" y="424" fill="#8ea2b5" font-size="12.5">· El total de días no se guarda: se recalcula, así no se desincroniza.</text>

  <text x="460" y="492" fill="#6d7d8c" font-size="12.5" text-anchor="middle">Ninguna pantalla lee ni escribe el archivo: solo publican intenciones y reciben el estado ya cargado.</text>
</svg>
