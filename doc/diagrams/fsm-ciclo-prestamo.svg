<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="580" fill="#11161c"/>
  <text x="450" y="42" fill="#e8eef5" font-size="24" font-weight="600" text-anchor="middle">Máquina de estados del ciclo del ejemplar</text>
  <text x="450" y="67" fill="#8ea2b5" font-size="14" text-anchor="middle">Biblioteca Interactiva 2D — Laboratorio 6</text>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fb3d8"/>
    </marker>
    <marker id="flechaRoja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c75c5c"/>
    </marker>
    <marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fc78a"/>
    </marker>
  </defs>

  <circle cx="118" cy="190" r="11" fill="#e8eef5"/>
  <line x1="129" y1="190" x2="198" y2="190" stroke="#6fb3d8" stroke-width="2.5" marker-end="url(#flecha)"/>

  <rect x="205" y="150" width="225" height="82" rx="12" fill="#1b2630" stroke="#6fb3d8" stroke-width="2.5"/>
  <text x="317" y="184" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">EN_ESTANTE</text>
  <text x="317" y="208" fill="#8ea2b5" font-size="12.5" text-anchor="middle">ningún ejemplar abierto</text>

  <rect x="540" y="150" width="225" height="82" rx="12" fill="#1b2630" stroke="#6fb3d8" stroke-width="2.5"/>
  <text x="652" y="184" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">EN_CONSULTA</text>
  <text x="652" y="208" fill="#8ea2b5" font-size="12.5" text-anchor="middle">ficha visible · admite plazo</text>

  <rect x="540" y="330" width="225" height="82" rx="12" fill="#1b2630" stroke="#d8b26f" stroke-width="2.5"/>
  <text x="652" y="364" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">REGISTRANDO</text>
  <text x="652" y="388" fill="#8ea2b5" font-size="12.5" text-anchor="middle">congelado · Tween</text>

  <rect x="205" y="330" width="225" height="82" rx="12" fill="#1b2630" stroke="#6fc78a" stroke-width="2.5"/>
  <text x="317" y="364" fill="#e8eef5" font-size="17" font-weight="600" text-anchor="middle">PRESTADO</text>
  <text x="317" y="388" fill="#8ea2b5" font-size="12.5" text-anchor="middle">registrado · confirma y cierra</text>

  <line x1="430" y1="176" x2="533" y2="176" stroke="#6fb3d8" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="481" y="164" fill="#9dc8e0" font-size="12.5" text-anchor="middle">item_opened</text>

  <line x1="540" y1="208" x2="437" y2="208" stroke="#6fb3d8" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="481" y="230" fill="#9dc8e0" font-size="12.5" text-anchor="middle">item_closed</text>

  <line x1="605" y1="232" x2="605" y2="323" stroke="#6fb3d8" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="592" y="270" fill="#9dc8e0" font-size="12.5" text-anchor="end">elige plazo</text>
  <text x="592" y="288" fill="#9dc8e0" font-size="12.5" text-anchor="end">(item_added)</text>

  <line x1="705" y1="330" x2="705" y2="239" stroke="#c75c5c" stroke-width="2.5" marker-end="url(#flechaRoja)"/>
  <text x="718" y="280" fill="#e0a0a0" font-size="12.5">ya estaba</text>
  <text x="718" y="298" fill="#e0a0a0" font-size="12.5">prestado</text>

  <line x1="540" y1="371" x2="437" y2="371" stroke="#6fc78a" stroke-width="2.5" marker-end="url(#flechaVerde)"/>
  <text x="488" y="359" fill="#9ed8b4" font-size="12.5" text-anchor="middle">disponible</text>

  <line x1="317" y1="330" x2="317" y2="239" stroke="#6fc78a" stroke-width="2.5" marker-end="url(#flechaVerde)"/>
  <text x="304" y="285" fill="#9ed8b4" font-size="12.5" text-anchor="end">fin del cierre</text>

  <rect x="150" y="448" width="600" height="108" rx="10" fill="#161d25" stroke="#3a4550" stroke-width="1.5"/>
  <text x="172" y="476" fill="#c9d6e2" font-size="13.5" font-weight="600">Transiciones inválidas (rechazadas por _cambiar_estado)</text>
  <text x="172" y="502" fill="#8ea2b5" font-size="12.5">· en_estante → registrando: no se puede elegir plazo sin abrir un ejemplar.</text>
  <text x="172" y="524" fill="#8ea2b5" font-size="12.5">· registrando → registrando: un segundo clic durante la animación se descarta.</text>
  <text x="172" y="546" fill="#8ea2b5" font-size="12.5">· en_estante → prestado: ningún ejemplar sale sin pasar por el mostrador.</text>
</svg>
